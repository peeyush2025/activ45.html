<!DOCTYPE html>
<html>
    <head>
        <title>my planet cards</title>
    </head>
    <style>
        body {
            font-family: Arial;
            background: #f0f4ff;
            padding: 30px;
            text-align: center;
        }
        h1 {
            color: #ff5a43;
        }
        p{
            color: #555;
        }
        .cards{
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .card{
            background: white;
            border: 2px solid #ff5a43;  

        }
        .planet-name{
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }
        .planet-fact{color: #666;
            font-size: 16px;
            margin-top: 10px;
        }
        button {
            background: #ff5a43;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
        }
    
    </style>
    <body>
        <h1>My Planet Cards</h1>
        <p>use javascript class to build planet cards</p>
        <button onclick="showPlanets()">Show Planets</button>
        <div class="cards" >
            <div id="card1"></div>
            <div id="card2"></div>
            <div id="card3"></div>
            <div id="card4"></div>
            <div id="card5"></div>
            <div id="card6"></div>
            <div id="card7"></div>
            <div id="card8"></div>  
            <div id="card9"></div>
            <div id="card10"></div>
        </div>
    </body>
    <script>
        class Planet {
            constructor(name, fact) {
                this.name = name;
                this.fact = fact;
            }
            describe() {
                return this.name + ": " + this.fact;
            }
        }
        function showPlanets() {
            let p1 = new Planet("Mercury", "Mercury is the closest planet to the Sun.");
            let p2 = new Planet("Venus", "Venus is the hottest planet in our solar system.");
            let p3 = new Planet("Earth", "Earth is the only planet known to support life.");
            let p4 = new Planet("Mars", "Mars is known as the Red Planet.");
            let p5 = new Planet("Jupiter", "Jupiter is the largest planet in our solar system.");
            let p6 = new Planet("Saturn", "Saturn is famous for its beautiful rings.");
            let p7 = new Planet("Uranus", "Uranus rotates on its side, making it unique among the planets.");
            let p8 = new Planet("Neptune", "Neptune is known for its strong winds and storms.");
            let p9 = new Planet("Pluto", "Pluto is a dwarf planet in the Kuiper belt.");
            let p10 = new Planet("Ceres", "Ceres is the largest object in the asteroid belt between Mars and Jupiter.");

            document.getElementById("card1").innerHTML = 
            "<div class='card'><div class='planet-name'>" + p1.name + "</div><div class='planet-fact'>" + p1.fact + "</div></div>";
            document.getElementById("card2").innerHTML =
            "<div class='card'><div class='planet-name'>" + p2.name + "</div><div class='planet-fact'>" + p2.fact + "</div></div>";
            document.getElementById("card3").innerHTML =
            "<div class='card'><div class='planet-name'>" + p3.name + "</div><div class='planet-fact'>" + p3.fact + "</div></div>";
            document.getElementById("card4").innerHTML =
            "<div class='card'><div class='planet-name'>" + p4.name + "</div><div class='planet-fact'>" + p4.fact + "</div></div>";
            document.getElementById("card5").innerHTML =
            "<div class='card'><div class='planet-name'>" + p5.name + "</div><div class='planet-fact'>" + p5.fact + "</div></div>";
            document.getElementById("card6").innerHTML =
            "<div class='card'><div class='planet-name'>" + p6.name + "</div><div class='planet-fact'>" + p6.fact + "</div></div>";
            document.getElementById("card7").innerHTML =
            "<div class='card'><div class='planet-name'>" + p7.name + "</div><div class='planet-fact'>" + p7.fact + "</div></div>";
            document.getElementById("card8").innerHTML =
            "<div class='card'><div class='planet-name'>" + p8.name + "</div><div class='planet-fact'>" + p8.fact + "</div></div>";
            document.getElementById("card9").innerHTML =
            "<div class='card'><div class='planet-name'>" + p9.name + "</div><div class='planet-fact'>" + p9.fact + "</div></div>";
            document.getElementById("card10").innerHTML =
            "<div class='card'><div class='planet-name'>" + p10.name + "</div><div class='planet-fact'>" + p10.fact + "</div></div>";
        }



        
    </script>
</html>
